# LOCAL PROPOSAL ONLY. No dispatch until separately approved and reviewed.
name: Read-only Preview diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roy-web-sales-previews-publisher
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'roy-baty-ai/roy-preview-publisher' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: cloudflare-preview-publish
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fixed GET diagnosis only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 -I tools/pages-preview/diagnose.py
